<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<!-- Настройки игры: src/config.js. -->
<title>БИОВШИ — Гладиаторские бои</title>



<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/layout.css">
<link rel="stylesheet" href="./styles/betting.css">
<link rel="stylesheet" href="./styles/interface.css">
</head>
<body>
<div id="texture-loading" role="status">Подготовка арены…</div>


<div id="robot-tag-hops-v22">
  <div class="viz-controls atmosphere-controls">
<button id="tag7hop-pause" class="btn" type="button" aria-pressed="false">Пауза</button>
<button id="tag7hop-speed" class="btn" type="button" aria-pressed="false" aria-label="Ускорение времени в 2 раза" title="Ускорить бой в 2 раза">×2</button>
<button id="tag7hop-reset" class="btn" type="button">Сброс</button>

<output id="render-fps" aria-label="Частота отрисовки">— FPS</output>
<span id="tag7hop-status" class="text-small" aria-live="polite">Гладиаторы · каждый сам за себя</span>
<button id="arena-settings-button" class="btn settings-button" type="button" aria-label="Настройки" aria-controls="arena-settings" aria-expanded="false" title="Настройки">
<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M9.5 2.5h5l.6 2.6 2.1 1.2 2.6-.8 2.5 4.3-2 1.8v2.4l2 1.8-2.5 4.3-2.6-.8-2.1 1.2-.6 2.6h-5l-.6-2.6-2.1-1.2-2.6.8-2.5-4.3 2-1.8v-2.4l-2-1.8 2.5-4.3 2.6.8 2.1-1.2z" transform="translate(0 -1) scale(1 .96)" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
</button>
</div>

<div id="arena-settings" class="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="arena-settings-title" hidden>
 <div class="settings-panel">
  <header><h2 id="arena-settings-title">Настройки</h2><button id="arena-settings-close" class="btn" type="button" aria-label="Закрыть настройки">✕</button></header>
  <label class="graphics-control">Графика <select id="graphics-quality" aria-label="Качество графики"><option value="auto">Авто</option><option value="full">Полная</option><option value="light">Лёгкая</option></select></label>
  <div id="arena-settings-content"></div>
 </div>
</div>

<div id="bet-overlay" class="bet-overlay" role="dialog" aria-modal="true" aria-labelledby="bet-title" hidden>
 <div class="bet-panel">
  <div class="bet-kicker">БИОВШИ · КАРМАННЫЙ ТОТАЛИЗАТОР</div>
  <h2 id="bet-title"></h2>
  <div id="bet-content"></div>
 </div>
</div>
  <div class="tag7hop-layout">
    <aside class="tag7hop-sidebar-wrap" aria-label="Боковая телеметрия роботов">
      <div id="tag7hop-roles" class="tag7hop-sidebar"></div>
    </aside>
    <div class="tag7hop-main">
  <div class="tag7hop-stage">
  <div id="tag7hop-intro" class="tag7hop-intro" role="dialog" aria-modal="true" aria-labelledby="tag7hop-intro-title">
    <div class="tag7hop-intro-card">
      <h1 id="tag7hop-intro-title"><span>БИОВШИ</span> <small>ГЛАДИАТОРСКИЕ БОИ</small></h1>
      <button id="tag7hop-start" type="button">начать</button>
    </div>
  </div>
  <div id="gladiator-results" class="gladiator-results" role="dialog" aria-modal="true" aria-labelledby="gladiator-results-title" hidden>
    <div class="gladiator-results-card">
      <div class="gladiator-results-kicker">БИОВШИ · ИТОГИ АРЕНЫ</div>
      <h2 id="gladiator-results-title">ПОБЕДИТЕЛЬ — A</h2>
      <p id="gladiator-results-summary" class="gladiator-results-summary"></p>
      <div id="gladiator-results-totals" class="gladiator-results-totals"></div>
      <div class="gladiator-results-table-wrap">
        <table class="gladiator-results-table" aria-label="Статистика роботов">
          <thead><tr><th>Робот</th><th>Сегменты</th><th>Попадания</th><th>Получено</th><th>Итог</th></tr></thead>
          <tbody id="gladiator-results-rows"></tbody>
        </table>
      </div>
      <div id="bet-result-summary"></div>
      <button id="gladiator-results-again" type="button">СЛЕДУЮЩИЙ РАУНД · ГАРАЖ</button>
    </div>
  </div>
  <svg id="tag7hop-field" viewBox="-38 -38 776 776" role="img" aria-label="Четыре биоробота сражаются каждый сам за себя на арене семь на семь метров в мрачной операционной. Тёмная плитка, приглушённый больничный свет и тёплые фонари роботов. Пять препятствий и внешний периметр со скошенными углами. Буквы роботов совпадают по цвету с карточками." style="display:block;width:100%;height:auto;aspect-ratio:1;overflow:hidden">
    <title>Гладиаторы: четыре робота, поле 7 × 7 м</title>
<g id="tag7hop-arena-content">
    <rect width="700" height="700" fill="var(--background)">
</rect>
<g id="tag7hop-grid">
</g>
<g id="tag7hop-cones">
</g>
<g id="tag7hop-block">
<rect x="300" y="300" width="100" height="100">
</rect>
</g>
<g id="tag7hop-trails" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width=".8">
</g>
<g id="tag7hop-ground">
</g>
<g id="tag7hop-actors">
</g>
<g id="tag7hop-sparks" fill="none" stroke-width="1.2">
</g>
<g id="tag7hop-pulses" fill="none" stroke-width="1.2">
</g>
    <defs>
<g id="tag7hop-gradients">
</g>
<mask id="tag7hop-darkness-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="700" height="700" style="mask-type:luminance">
<rect width="700" height="700" fill="white">
</rect>
<g id="tag7hop-light-holes" fill="black">
</g>
</mask>
</defs>
    <rect id="tag7hop-darkness" width="700" height="700" fill="var(--night-bg)" opacity="0.9" mask="url(#tag7hop-darkness-mask)" pointer-events="none">
</rect>
    <g id="tag7hop-score" role="img" aria-label="Оставшиеся сегменты: A — 0, B — 0, C — 0, D — 0">
<title>Съедено соперников</title>
</g>
    <text id="tag7hop-timer" x="350" y="30" text-anchor="middle" dominant-baseline="middle" role="timer" aria-live="off" aria-label="Время раунда" pointer-events="none">0:00</text>
  </g>
  </svg>
  <button id="arena-expand-button" class="btn arena-expand-button" type="button" aria-label="Развернуть" aria-pressed="false" title="Развернуть">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="13.5" rx="1.5"/><path d="M8 21h8M12 17v4M6 8V7h3m6 0h3v1M6 12v1h3m6 0h3v-1"/></svg>
  </button>
  </div>

    </div>
    <aside id="bet-hud" aria-label="Банк и ставки игроков" aria-live="polite" hidden></aside>
  </div>
</div>


<script type="module" src="./src/main.js"></script>
































</body>
</html>
