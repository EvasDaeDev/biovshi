<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>БИОВШИ · Редактор скелета пациента</title>
<style>
  :root{color-scheme:dark;--bg:#101716;--panel:#17211f;--line:#31413b;--text:#ecf1e8;--mute:#a4b5ac;--lime:#d8f29e;--grid:#12211e;--amber:#ffd296;--ink:#182411}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
  button,input,select{font:inherit}
  button,select,input[type=number]{background:#1c2925;color:var(--text);border:1px solid #42544b;border-radius:7px;min-height:38px;padding:6px 11px}
  button{cursor:pointer}
  button:hover:not(:disabled){border-color:var(--lime);background:#283930}
  button:focus-visible,select:focus-visible,input:focus-visible,svg:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
  button:disabled{opacity:.38;cursor:default}
  .shell{max-width:1500px;margin:auto;padding:26px clamp(14px,3vw,42px) 22px}
  header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:22px;flex-wrap:wrap}
  .brand{color:var(--lime);font-size:12px;font-weight:750;letter-spacing:.17em}
  h1{margin:3px 0 0;font-size:clamp(25px,4vw,43px);letter-spacing:-.035em;line-height:1.14}
  h2{font-size:16px;margin:0 0 12px}
  .actions,.tools,.layer-switches,.zoom-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .primary{background:var(--lime);border-color:var(--lime);color:var(--ink);font-weight:750}
  .primary:hover:not(:disabled){background:#ebffbe;color:var(--ink)}
  .workspace{display:grid;grid-template-columns:minmax(0,1fr) 305px;gap:14px;align-items:start}
  .stage,.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
  .tools{padding:10px 12px;justify-content:space-between}
  .layer-switches label,.panel label.snap{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
  .layer-switches{column-gap:14px}
  input[type=checkbox]{accent-color:var(--lime);width:16px;height:16px;margin:0}
  .zoom-controls{gap:5px}
  .zoom-controls button{min-width:36px;min-height:34px;padding:3px 9px}
  .board{background:var(--grid);border-block:1px solid var(--line);min-width:0}
  #rig{display:block;width:100%;height:clamp(340px,62vh,760px);touch-action:none;user-select:none}
  .axis{stroke:#8fae9e;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.6}
  #ticks text{fill:#96b5a5;font-family:ui-monospace,monospace;paint-order:stroke;stroke:var(--grid);stroke-width:.24;stroke-linejoin:round;pointer-events:none}
  #bone-lines line{stroke:#c6e8dc;stroke-width:1.45;vector-effect:non-scaling-stroke;opacity:.86;pointer-events:none}
  #bone-lines line.highlight{stroke:var(--amber);stroke-width:2.45;opacity:1}
  #bone-lines .connector{stroke-dasharray:4 4;opacity:.62}
  .joint{cursor:grab}
  .joint:active{cursor:grabbing}
  .handle{fill:#172925;stroke:#c5e9d9;stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none}
  .joint[aria-pressed=true] .handle{fill:var(--amber);stroke:#30241d;stroke-width:2}
  .joint:hover .handle{stroke:var(--amber)}
  #textures,#neck{pointer-events:none}
  #textures image{image-rendering:pixelated}
  .caption{margin:0;padding:10px 12px;color:var(--mute);font-size:13px}
  .caption span{color:var(--amber);font-weight:700}
  .card{padding:15px 16px;border-bottom:1px solid var(--line)}
  .card:last-child{border:0}
  .edit-modes{display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .mode-hint{margin:0;color:var(--mute);font-size:12px}
  .joint.mirrored .handle{stroke:var(--amber);stroke-dasharray:2 2}
  .field{display:grid;gap:5px}
  .field label{color:var(--mute);font-size:13px;font-weight:650}
  .field select,.field input{width:100%}
  .coordinates{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-block:11px}
  .coords-ref{font:12px/1.5 ui-monospace,monospace;color:var(--mute);margin:0 0 9px;min-height:2.7em}
  .lengths{list-style:none;margin:0;padding:0}
  .lengths li{display:flex;justify-content:space-between;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
  .lengths li:last-child{border:0}
  .lengths strong{font:13px/1.4 ui-monospace,monospace;color:var(--lime);white-space:nowrap}
  .edit-actions button{font-size:13px;padding:5px 8px}
  .reset{margin-top:8px}
  .status{min-height:1.5em;margin:10px 0 0;color:var(--mute);font-size:13px}
  .status.error{color:#ffae9d}
  .source{font:12px/1.5 ui-monospace,monospace;color:var(--mute);margin-top:12px}
  @media(max-width:900px){.workspace{grid-template-columns:minmax(0,1fr) 245px} .layer-switches{font-size:13px}}
  @media(max-width:700px){.workspace{grid-template-columns:1fr} #rig{height:clamp(280px,57vw,460px)} .caption{font-size:12px} header{margin-bottom:14px}}
  @media(max-width:380px){.actions,.layer-switches{gap:6px}.actions button{font-size:13px}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div><div class="brand">БИОВШИ</div><h1>Редактор скелета пациента</h1></div>
    <div class="actions">
      <button id="import-file" type="button">Импорт JSON</button>
      <button id="save-file" class="primary" type="button">Скачать JSON</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main class="workspace">
    <section class="stage" aria-label="Чертёж пациента">
      <div class="tools">
        <div class="layer-switches">
          <label><input id="show-grid" type="checkbox" checked>Сетка</label>
          <label><input id="show-textures" type="checkbox" checked>Текстуры</label>
          <label><input id="show-bones" type="checkbox" checked>Скелет</label>
        </div>
        <div class="zoom-controls" role="group" aria-label="Масштаб чертежа">
          <button id="zoom-out" type="button" aria-label="Отдалить">−</button>
          <button id="zoom-in" type="button" aria-label="Приблизить">+</button>
          <button id="zoom-fit" type="button">Вписать</button>
        </div>
      </div>
      <div class="board">
        <svg id="rig" xmlns="http://www.w3.org/2000/svg" tabindex="0" aria-label="Редактируемый скелет пациента" viewBox="-54 -32 86 64">
          <defs>
            <pattern id="minor" width="1" height="1" patternUnits="userSpaceOnUse">
              <path d="M1 0H0V1" fill="none" stroke="#263d36" stroke-width=".085"/>
            </pattern>
            <pattern id="major" width="5" height="5" patternUnits="userSpaceOnUse">
              <path d="M5 0H0V5" fill="none" stroke="#4d655a" stroke-width=".15"/>
            </pattern>
          </defs>
          <g id="grid" pointer-events="none">
            <rect id="fine-grid" fill="url(#minor)"/>
            <rect id="coarse-grid" fill="url(#major)"/>
            <path id="axes" class="axis" fill="none"/>
            <g id="ticks"/>
          </g>
          <line id="neck" stroke="#a78a70" stroke-width="1.5" stroke-linecap="round"/>
          <g id="textures"/>
          <g id="skeleton"><g id="bone-lines"/><g id="joints"/></g>
        </svg>
      </div>
      <p class="caption"><span>Мелкая клетка — 1 см.</span> Крупная — 5 см. Начало координат там, где исходно находится грудь. X вправо, Y вниз.</p>
    </section>
    <aside class="panel" aria-label="Настройки скелета">
      <section class="card field">
        <label for="patient">Пациент</label>
        <select id="patient">
          <option value="0">A · r_01</option><option value="1">B · r_02</option>
          <option value="2">C · r_03</option><option value="3">D · r_04</option>
        </select>
      </section>
      <section class="card">
        <h2>Положение точки</h2>
        <div class="field"><label for="node">Точка скелета</label><select id="node"></select></div>
        <div class="coordinates">
          <div class="field"><label for="x">X · см</label><input id="x" type="number" step="any" min="-500" max="500"></div>
          <div class="field"><label for="y">Y · см</label><input id="y" type="number" step="any" min="-500" max="500"></div>
        </div>
        <p id="reference" class="coords-ref"></p>
        <label class="snap"><input id="snap" type="checkbox" checked>Привязка перетаскивания к 1 см</label>
        <div class="edit-modes" role="group" aria-label="Режимы правки позы">
          <label class="snap"><input id="lock-lengths" type="checkbox" aria-describedby="mode-hint">Фиксировать длины сегментов</label>
          <label class="snap"><input id="mirror-y" type="checkbox" aria-describedby="mode-hint">Симметрия по Y</label>
          <p id="mode-hint" class="mode-hint"></p>
        </div>
      </section>
      <section class="card">
        <h2>Длины связанных костей</h2>
        <ul id="lengths" class="lengths"></ul>
      </section>
      <section class="card">
        <div class="actions edit-actions">
          <button id="undo" type="button">Отменить</button>
          <button id="redo" type="button">Повторить</button>
        </div>
        <button id="reset" class="reset" type="button">Сбросить позу пациента</button>
        <p class="caption" style="padding:9px 0 0">Тяните точки или вводите координаты. Стрелки на чертеже двигают выбранную точку на 1 см, с Shift — на 0,1 см.</p>
      </section>
    </aside>
  </main>
  <p id="status" class="status" role="status"></p>
  <footer id="source" class="source"></footer>
</div>

<script>
'use strict';
const project=JSON.parse(document.getElementById('project-data').textContent);
const $=id=>document.getElementById(id);
const svg=$('rig');
const format=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const round=value=>Math.round(value*10000)/10000;
const cp=value=>JSON.parse(JSON.stringify(value));
const constrain=value=>Math.min(500,Math.max(-500,value));
const poses=project.atlases.map(()=>cp(project.baseline));
const histories=poses.map(()=>({undo:[],redo:[]}));
const joints=new Map(),bones=new Map(),pieces=new Map();
let patient=0,selected='arm--1-joint',drag=null;
let camera=[-54,-32,86,64];
const bridges=[
  ['shoulders','arm--1-root','arm-1-root'],
  ['hips','leg--1-root','leg-1-root'],
  ['neck','spine-0','head-back']
];
const girdles={
  'spine-0':['arm--1-root','arm-1-root'],
  'spine-4':['leg--1-root','leg-1-root']
};
const attachmentRoots=new Map(Object.entries(girdles).flatMap(([parent,roots])=>
  roots.map(root=>[root,parent])));
const parents=new Map([
  ...project.parts.map(([,a,b])=>[b,a]),
  ...attachmentRoots,
  ['head-back','spine-0']
]);
const children=new Map(Object.keys(project.nodes).map(id=>[id,[]]));
for(const [child,parent] of parents)children.get(parent).push(child);
const mirrored=new Map(Object.keys(project.nodes).flatMap(id=>{
  const match=id.match(/^(arm|leg)-(-?1)-(root|joint|tip)$/);
  return match?[[id,match[1]+'-'+(-Number(match[2]))+'-'+match[3]]]:[];
}));
const mirrorPoint=([x,y])=>[x,-y];
const vector=([x,y],[ox,oy])=>[x-ox,y-oy];
const distance=(a,b)=>Math.hypot(...vector(a,b));
const magnitude=pair=>Math.hypot(...pair);
const geometryEpsilon=1e-9;

function visitBranch(id,visit){
  visit(id);
  for(const child of children.get(id))visitBranch(child,visit);
}

function translatePose(pose,dx,dy){
  for(const [id,[x,y]] of Object.entries(pose))pose[id]=[x+dx,y+dy];
}

function rotateBranch(pose,id,pivot,cos,sin){
  visitBranch(id,key=>{
    const [x,y]=vector(pose[key],pivot);
    pose[key]=[pivot[0]+cos*x-sin*y,pivot[1]+sin*x+cos*y];
  });
}

function bendSide(pose,root,joint,tip){
  const [dx,dy]=vector(pose[tip],pose[root]);
  const [jx,jy]=vector(pose[joint],pose[root]);
  return dx*jy-dy*jx;
}

// Solve a two-segment limb against a fixed root. A point outside its reach
// is projected onto the nearest reachable circle.
function moveLimbTip(pose,tip,target){
  const joint=parents.get(tip),root=parents.get(joint),anchor=pose[root];
  const upper=distance(anchor,pose[joint]),lower=distance(pose[joint],pose[tip]);
  const wanted=vector(target,anchor),wantedLength=magnitude(wanted);
  const radius=Math.max(Math.abs(upper-lower),Math.min(wantedLength,upper+lower));
  if(radius<geometryEpsilon){
    pose[tip]=[...anchor];
    return;
  }
  const direction=wantedLength>geometryEpsilon?wanted:vector(pose[tip],anchor);
  const angle=Math.atan2(direction[1],direction[0]);
  const x=Math.cos(angle),y=Math.sin(angle);
  const previousBend=bendSide(pose,root,joint,tip);
  const side=Math.sign(Math.abs(previousBend)>geometryEpsilon?previousBend:
    bendSide(project.baseline,root,joint,tip))||1;
  const along=Math.min(upper,Math.max(-upper,((upper-lower)*(upper+lower)+radius*radius)/(2*radius)));
  const bend=side*Math.sqrt(Math.max(0,upper*upper-along*along));
  pose[joint]=[anchor[0]+x*along-y*bend,anchor[1]+y*along+x*bend];
  pose[tip]=[anchor[0]+x*radius,anchor[1]+y*radius];
}

function moveWithLengths(pose,id,target){
  const parent=parents.get(id);
  if(!parent){
    translatePose(pose,...vector(target,pose[id]));
    return;
  }
  if(id.endsWith('-tip')){
    moveLimbTip(pose,id,target);
    return;
  }
  const pivot=pose[parent],original=vector(pose[id],pivot),wanted=vector(target,pivot);
  if(magnitude(original)<geometryEpsilon||magnitude(wanted)<geometryEpsilon)return;
  const angle=Math.atan2(wanted[1],wanted[0])-Math.atan2(original[1],original[0]);
  const cos=Math.cos(angle),sin=Math.sin(angle);
  const roots=attachmentRoots.has(id)?girdles[parent]:[id];
  for(const root of roots)rotateBranch(pose,root,pivot,cos,sin);
}

function editedPose(base,id,target,lock,symmetry){
  const opposite=symmetry?mirrored.get(id):undefined;
  const pose=cp(base);
  if(!lock){
    pose[id]=symmetry&&!opposite?[target[0],0]:target;
    if(opposite)pose[opposite]=mirrorPoint(pose[id]);
    return pose;
  }
  // A symmetric girdle keeps both attachment points and its current width.
  if(symmetry&&attachmentRoots.has(id))return pose;
  if(symmetry&&!opposite){
    translatePose(pose,target[0]-base[id][0],0);
    return pose;
  }
  moveWithLengths(pose,id,target);
  if(opposite)moveWithLengths(pose,opposite,mirrorPoint(pose[id]));
  return pose;
}

function samePose(a,b){
  return Object.keys(a).every(id=>distance(a[id],b[id])<geometryEpsilon);
}

function svgElement(tag,attributes,parent){
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  set(el,attributes);
  parent.append(el);
  return el;
}
function set(el,attributes){
  for(const [key,value] of Object.entries(attributes))el.setAttribute(key,value);
}
function skinMatrix(a,b,part){
  const dx=b[0]-a[0],dy=b[1]-a[1],length=Math.hypot(dx,dy);
  const from=part.from??8,to=part.to??56;
  const sx=length/(to-from),sy=sx*(part.widthScale??1);
  const ux=length?dx/length:1,uy=length?dy/length:0;
  const A=ux*sx,B=uy*sx,C=-uy*sy,D=ux*sy;
  return [A,B,C,D,a[0]-A*from-C*32,a[1]-B*from-D*32];
}
function line(el,[x1,y1],[x2,y2]){set(el,{x1,y1,x2,y2});}
function offset(a,b,length){
  const distance=Math.hypot(b[0]-a[0],b[1]-a[1])||1;
  return [a[0]+(b[0]-a[0])/distance*length,a[1]+(b[1]-a[1])/distance*length];
}

for(const [key] of project.parts){
  const part=project.atlasParts[key];
  const group=svgElement('g',{'data-piece':key},$('textures'));
  const clip=svgElement('svg',{viewBox:[part.col*64,part.row*64,64,64].join(' '),width:64,height:64,
    overflow:'hidden',preserveAspectRatio:'none'},group);
  const image=svgElement('image',{width:256,height:256,preserveAspectRatio:'none'},clip);
  pieces.set(key,{group,image,part});
}
for(const [key] of bridges)bones.set(key,svgElement('line',{class:'connector'},$('bone-lines')));
for(const [key] of project.parts)bones.set(key,svgElement('line',{'data-bone':key},$('bone-lines')));
const groups=new Map();
for(const [id,node] of Object.entries(project.nodes)){
  if(!groups.has(node.group)){
    const optgroup=document.createElement('optgroup');
    optgroup.label=node.group;
    $('node').append(optgroup);
    groups.set(node.group,optgroup);
  }
  groups.get(node.group).append(new Option(node.label,id));
  const handle=svgElement('g',{class:'joint','data-joint':id,role:'button',
    'aria-label':node.group+' · '+node.label},$('joints'));
  svgElement('title',{},handle).textContent=node.group+' · '+node.label;
  svgElement('circle',{class:'hit-target',r:1.5,fill:'transparent'},handle);
  svgElement('circle',{class:'handle',r:.65},handle);
  joints.set(id,handle);
}

function applyAtlas(){
  for(const {image} of pieces.values())image.setAttribute('href',project.atlases[patient].data);
}
function applyCamera(){
  svg.setAttribute('viewBox',camera.join(' '));
  const [x,y,w,h]=camera;
  for(const id of ['fine-grid','coarse-grid'])set($(id),{x,y,width:w,height:h});
  $('axes').setAttribute('d','M'+x+',0 H'+(x+w)+' M0,'+y+' V'+(y+h));
  $('ticks').replaceChildren();
  const step=w>135?20:w>55?10:5;
  const fontSize=Math.max(1,Math.min(4,w/51));
  const xLabels=y+h-1.1*fontSize;
  const yLabels=x+1.25*fontSize;
  for(let v=Math.ceil(x/step)*step;v<x+w-fontSize;v+=step){
    if(v>x+3.5*fontSize)svgElement('text',{x:v,y:xLabels,'font-size':fontSize,'text-anchor':'middle'},$('ticks')).textContent=v;
  }
  for(let v=Math.ceil(y/step)*step;v<y+h-fontSize;v+=step){
    if(v>y+fontSize&&v<xLabels-fontSize)svgElement('text',{x:yLabels,y:v,'font-size':fontSize},$('ticks')).textContent=v;
  }
  for(const joint of joints.values()){
    joint.querySelector('.handle').setAttribute('r',Math.max(.31,w/117));
    joint.querySelector('.hit-target').setAttribute('r',Math.max(.9,w/53));
  }
  $('fine-grid').style.display=w>160?'none':'';
}
function fit(){
  const all=Object.values(poses[patient]);
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const rect=svg.getBoundingClientRect();
  const ratio=rect.height>0?Math.max(1,rect.width/rect.height):1.4;
  const height=Math.max(56,maxY-minY+18,(maxX-minX+22)/ratio);
  const width=height*ratio;
  camera=[(minX+maxX-width)/2,(minY+maxY-height)/2,width,height];
  applyCamera();
}
function zoom(factor){
  const [x,y,w,h]=camera;
  if(w*factor<18||w*factor>1800)return;
  camera=[x+w*(1-factor)/2,y+h*(1-factor)/2,w*factor,h*factor];
  applyCamera();
}
function editStatus(message='',error=false){
  $('status').textContent=message;
  $('status').classList.toggle('error',error);
}
function render(){
  const pose=poses[patient];
  const lock=$('lock-lengths').checked,symmetry=$('mirror-y').checked;
  const opposite=symmetry?mirrored.get(selected):undefined;
  for(const [key,a,b] of project.parts){
    const {group,part}=pieces.get(key);
    group.setAttribute('transform','matrix('+skinMatrix(pose[a],pose[b],part).join(' ')+')');
    line(bones.get(key),pose[a],pose[b]);
    bones.get(key).classList.toggle('highlight',selected===a||selected===b||opposite===a||opposite===b);
  }
  for(const [key,a,b] of bridges)line(bones.get(key),pose[a],pose[b]);
  line($('neck'),offset(pose['spine-0'],pose['spine-1'],-1.5),offset(pose['head-back'],pose['head-front'],1.5));
  for(const [id,handle] of joints){
    const [x,y]=pose[id];
    set(handle,{transform:'translate('+x+' '+y+')','aria-pressed':String(id===selected)});
    handle.classList.toggle('mirrored',id===opposite);
  }
  const hints=[];
  if(symmetry)hints.push('Парные точки редактируются зеркально относительно линии Y = 0.');
  if(lock&&symmetry&&attachmentRoots.has(selected))hints.push('При двух включённых режимах плечи и бёдра закреплены.');
  else if(lock&&symmetry&&!opposite)hints.push('Осевые точки перемещают всю позу вдоль X.');
  else if(lock)hints.push('Кисти и стопы сгибают конечности в пределах их досягаемости.');
  $('mode-hint').textContent=hints.join(' ');
  $('node').value=selected;
  $('patient').value=String(patient);
  if(document.activeElement!==$('x'))$('x').value=round(pose[selected][0]);
  if(document.activeElement!==$('y'))$('y').value=round(pose[selected][1]);
  const original=project.baseline[selected];
  const delta=pose[selected].map((value,i)=>round(value-original[i]));
  $('reference').textContent='Исходно '+original.map(v=>format.format(v)).join(' / ')+' см · Δ '+delta.map(v=>(v>0?'+':'')+format.format(v)).join(' / ')+' см';
  $('lengths').replaceChildren();
  for(const [,a,b] of project.parts.filter(([,a,b])=>a===selected||b===selected)){
    const other=a===selected?b:a;
    const row=document.createElement('li'),label=document.createElement('span'),measure=document.createElement('strong');
    label.textContent=project.nodes[other].label;
    measure.textContent=format.format(distance(pose[selected],pose[other]))+' см';
    row.append(label,measure);$('lengths').append(row);
  }
  const history=histories[patient];
  $('undo').disabled=!history.undo.length;
  $('redo').disabled=!history.redo.length;
  $('reset').disabled=Object.keys(pose).every(id=>pose[id].every((value,i)=>value===project.baseline[id][i]));
}
function remember(before,id=patient){
  const history=histories[id];
  history.undo.push(before);
  if(history.undo.length>80)history.undo.shift();
  history.redo.length=0;
}
function travelHistory(direction){
  const history=histories[patient];
  if(!history[direction].length)return;
  history[direction==='undo'?'redo':'undo'].push(cp(poses[patient]));
  poses[patient]=history[direction].pop();
  render();
}
function updatePoint(target,before=null){
  const current=poses[patient],base=before??current;
  const next=editedPose(base,selected,target,$('lock-lengths').checked,$('mirror-y').checked);
  if(samePose(current,next))return;
  if(Object.values(next).some(point=>point.some(value=>!Number.isFinite(value)||Math.abs(value)>500))){
    editStatus('Точки позы должны оставаться в пределах ±500 см.',true);
    return;
  }
  if(!before)remember(current);
  poses[patient]=next;
  if($('status').classList.contains('error'))editStatus();
  render();
}
function worldPoint(event){
  const matrix=svg.getScreenCTM();
  if(!matrix)return null;
  const point=svg.createSVGPoint();
  point.x=event.clientX;point.y=event.clientY;
  const world=point.matrixTransform(matrix.inverse());
  return [world.x,world.y];
}
svg.addEventListener('pointerdown',event=>{
  if(event.button!==0||drag)return;
  const node=event.target.closest('[data-joint]');
  const point=worldPoint(event);
  if(!point)return;
  event.preventDefault();
  svg.focus();
  svg.setPointerCapture(event.pointerId);
  if(node){
    selected=node.dataset.joint;
    drag={id:event.pointerId,point,original:[...poses[patient][selected]],before:poses[patient]};
    render();
  }else{
    drag={id:event.pointerId,point,pan:true,axes:svg.getScreenCTM().inverse(),camera:[...camera],client:[event.clientX,event.clientY]};
  }
});
svg.addEventListener('pointermove',event=>{
  if(drag?.id!==event.pointerId)return;
  if(drag.pan){
    const dx=event.clientX-drag.client[0],dy=event.clientY-drag.client[1];
    camera=[drag.camera[0]-dx*drag.axes.a,drag.camera[1]-dy*drag.axes.d,...drag.camera.slice(2)];
    applyCamera();return;
  }
  const point=worldPoint(event);
  if(!point)return;
  const snap=$('snap').checked&&!event.altKey;
  updatePoint(point.map((value,i)=>{
    const position=drag.original[i]+value-drag.point[i];
    return constrain(snap?Math.round(position):round(position));
  }),drag.before);
});
function finishDrag(){
  if(!drag)return;
  if(!drag.pan&&!samePose(poses[patient],drag.before))remember(drag.before);
  drag=null;
  render();
}
for(const event of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(event,e=>{
  if(drag?.id===e.pointerId)finishDrag();
});

svg.addEventListener('keydown',event=>{
  const directions={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  const arrow=directions[event.key];
  if(!arrow)return;
  event.preventDefault();
  finishDrag();
  updatePoint(poses[patient][selected].map((value,i)=>constrain(round(value+arrow[i]*(event.shiftKey ? .1 : 1)))));
});
document.addEventListener('keydown',event=>{
  if(event.target.matches('input,select,textarea')||!(event.ctrlKey||event.metaKey))return;
  if(!['z','y'].includes(event.key.toLowerCase()))return;
  event.preventDefault();
  finishDrag();
  travelHistory(event.shiftKey||event.key.toLowerCase()==='y'?'redo':'undo');
});
$('node').onchange=()=>{const id=$('node').value;finishDrag();selected=id;render();};
$('patient').onchange=()=>{const id=Number($('patient').value);finishDrag();patient=id;applyAtlas();render();fit();};
for(const id of ['lock-lengths','mirror-y'])$(id).onchange=()=>{finishDrag();render();};
for(const [axis,index] of [['x',0],['y',1]]){
  const input=$(axis);
  input.onchange=()=>{
    const value=input.valueAsNumber;
    finishDrag();
    const position=[...poses[patient][selected]];
    if(Number.isFinite(value)){position[index]=constrain(round(value));updatePoint(position);}
    input.value=round(poses[patient][selected][index]);
  };
  input.onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();input.blur();}};
}
for(const [control,targets] of [['show-grid',['grid']],['show-textures',['textures','neck']],['show-bones',['skeleton']]]){
  $(control).onchange=()=>{for(const target of targets)$(target).style.display=$(control).checked?'':'none';};
}
$('zoom-in').onclick=()=>zoom(.8);
$('zoom-out').onclick=()=>zoom(1.25);
$('zoom-fit').onclick=fit;
$('undo').onclick=()=>{finishDrag();travelHistory('undo');};
$('redo').onclick=()=>{finishDrag();travelHistory('redo');};
$('reset').onclick=()=>{finishDrag();remember(cp(poses[patient]));poses[patient]=cp(project.baseline);render();fit();};
function exportDocument(){
  return {format:'biovshi-patient-rig',version:1,sourceCommit:project.source,units:'cm',
    origin:'initial-chest',xAxis:'right',yAxis:'down',
    patients:project.atlases.map(({name},id)=>({atlas:name,points:cp(poses[id])}))};
}
$('save-file').onclick=()=>{
  const blob=new Blob([JSON.stringify(exportDocument(),null,2)+'\n'],{type:'application/json'});
  const url=URL.createObjectURL(blob), anchor=document.createElement('a');
  anchor.href=url;anchor.download='biovshi-patient-rig.json';
  document.body.append(anchor);anchor.click();anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  editStatus('В JSON вошли координаты всех четырёх пациентов.');
};
function importDocument(data){
  if(data?.format!=='biovshi-patient-rig'||data.version!==1||data.units!=='cm'||
     data.origin!=='initial-chest'||data.xAxis!=='right'||data.yAxis!=='down'||!Array.isArray(data.patients)||data.patients.length!==poses.length)
    throw Error('Формат файла не поддерживается.');
  return project.atlases.map(({name})=>{
    const matches=data.patients.filter(item=>item?.atlas===name);
    if(matches.length!==1)throw Error('Проверьте список пациентов в JSON.');
    const points=matches[0].points;
    return Object.fromEntries(Object.keys(project.nodes).map(id=>{
      const point=points?.[id];
      if(!Array.isArray(point)||point.length!==2||point.some(v=>!Number.isFinite(v)||Math.abs(v)>500))
        throw Error('Некорректные координаты точки '+id+'.');
      return [id,[...point]];
    }));
  });
}
$('import-file').onclick=()=>$('file').click();
$('file').onchange=async()=>{
  const file=$('file').files[0];if(!file)return;
  try{
    const incoming=importDocument(JSON.parse(await file.text()));
    finishDrag();
    incoming.forEach((pose,i)=>{remember(cp(poses[i]),i);poses[i]=pose;});
    render();fit();editStatus('Координаты из JSON загружены.');
  }catch(error){editStatus(error.message||'Не удалось открыть JSON.',true);}
  finally{$('file').value='';}
};
$('source').textContent='Исходная игровая поза · test/combat-hit-sync @ '+project.source.slice(0,7);
applyAtlas();render();fit();
</script>
</body>
