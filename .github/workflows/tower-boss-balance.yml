name: Tower boss ally balance experiment

on:
  push:
    branches:
      - experiment/tower-bosses
    paths:
      - scripts/experiment-tower-fights.mjs
      - .github/workflows/tower-boss-balance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tower-boss-balance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boss-ally-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out experimental code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Observe first boss with idle player
        run: node scripts/experiment-tower-fights.mjs --bossBench=true --seeds=12 --limit=75 --policy=idle --out=artifacts/boss5-idle.json
      - name: Observe first boss with player keeping distance
        run: node scripts/experiment-tower-fights.mjs --bossBench=true --seeds=12 --limit=75 --policy=evade --out=artifacts/boss5-evade.json
      - name: Measure naturally generated first-boss fights with idle player
        run: node scripts/experiment-tower-fights.mjs --naturalBoss=true --seeds=40 --limit=75 --policy=idle --out=artifacts/boss5-natural-idle.json
      - name: Measure naturally generated first-boss fights with evading player
        run: node scripts/experiment-tower-fights.mjs --naturalBoss=true --seeds=40 --limit=75 --policy=evade --out=artifacts/boss5-natural-evade.json
      - name: Upload independent experiment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-boss-ally-diagnostics
          path: artifacts/boss5-*.json
          if-no-files-found: warn
