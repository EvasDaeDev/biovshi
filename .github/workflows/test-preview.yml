name: Request test preview deployment

on:
  push:
    branches: [experiment/tower-bosses]

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      # The Pages workflow receives workflow_run on main, so the protected
      # github-pages environment does not need to admit experimental branches.
      - name: Request combined stable and test publication
        run: echo 'Publish main at / and experiment/tower-bosses at /test/'
