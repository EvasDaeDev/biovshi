name: Request test preview deployment

on:
  push:
    branches: [test/combat-hit-sync]

permissions:
  contents: read

jobs:
  request:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LAN preview
    steps:
      - uses: actions/checkout@v4
        with:
          path: LAN preview
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: LAN preview/package-lock.json
      - run: npm ci
      - name: Build the Windows LAN server's game bundle
        run: |
          $output = Join-Path $PWD '.lan-dist/8081'
          npm run build:lan -- --outDir "$output" --emptyOutDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path (Join-Path $output 'index.html'))) { throw 'LAN build is missing index.html' }
