name: Tower II experimental validation

on:
  push:
    branches:
      - experiment/tower-bosses
  workflow_dispatch:

concurrency:
  group: tower-experiment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tower-part-two:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out experimental code only
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test ownership, equipment, DMS, surgery and infinite cycles
        run: node --test tests/tower-part2.test.js tests/tower-surgical-stock.test.js tests/tower-surgical-stock-ui.test.js
      - name: Run current game regression suite
        run: npm test
      - name: Simulate Tower-only economy
        run: node scripts/simulate-tower-economy.mjs
      - name: Analyze multi-cycle economy and 8-10-12 rarity hypotheses offline
        run: node scripts/simulate-tower-progression.mjs --seeds=160 --max-fights=420
      - name: Build playable game
        run: npm run build
      - name: Verify standalone HTML embeds upgrade textures
        run: |
          npm run standalone
          node --input-type=module -e "import fs from 'node:fs';const html=fs.readFileSync('dist/biovshi.html','utf8');for(const id of ['ar_surg_impact.png','ar_mod_turbo.png','ar_mod_quiet.png'])if(!html.includes(id))throw new Error('Missing inline atlas '+id);console.log('Upgrade textures embedded in offline HTML')"
      - name: Smoke test current boss floors without legacy arena-anatomy matrix
        run: node scripts/experiment-tower-fights.mjs --seeds=2 --limit=75 --floors=5,10,15,20,25,30 --policy=orbit --out=artifacts/tower-boss-survival.json
      - name: H9 - exercise every arena and all six boss floors with real physics
        run: node scripts/experiment-tower-fights.mjs --seeds=2 --limit=75 --policy=orbit --out=artifacts/tower-h9-all-arenas-and-bosses.json
      - name: H9 - audit arena coverage, result accounting and physics safety
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const result=JSON.parse(fs.readFileSync('artifacts/tower-h9-all-arenas-and-bosses.json','utf8'));
          const arenas=['ring','annulus','sluice','throat','zigzag','ward','columns'];
          const bossFloors=[5,10,15,20,25,30];
          assert.equal(result.total??result.runs.length,26,'Expected 13 scenarios times two seeds');
          assert.equal(result.runs.length,26);
          assert.equal(result.summary.errors,0,'Headless combat errors');
          assert.equal(result.summary.nonFinite,0,'Nonfinite physics');
          assert.equal(result.summary.initialPenetrations,0,'Initial body penetration');
          assert.equal(result.summary.initialOverlaps,0,'Initial body overlap');
          assert.equal(result.summary.completed+result.summary.timedOut,26,'Unaccounted fights');
          for(const arena of arenas){
            const matches=result.runs.filter(r=>r.kind==='normal'&&r.arena===arena);
            assert.equal(matches.length,2,'Missing normal arena '+arena);
          }
          for(const floor of bossFloors){
            const matches=result.runs.filter(r=>r.kind==='boss'&&r.floor===floor);
            assert.equal(matches.length,2,'Missing boss floor '+floor);
          }
          for(const r of result.runs){
            assert.deepEqual(r.errors,[],'Combat failed at floor '+r.floor);
            assert.ok(Number.isFinite(r.maxBodyOverlapCm),'Invalid body overlap at floor '+r.floor);
          }
          console.log('H9: 7 layouts + 6 boss floors, 2 seeds each; safety assertions passed.');
          NODE
      - name: Physical cycle AI checks for truces, bodyguards and mixed tactics
        run: node scripts/experiment-tower-fights.mjs --cycleTactics=true --seeds=1 --limit=40 --policy=orbit --out=artifacts/tower-cycle-tactics.json
      - name: Upload Part II model and encounter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-part-two-validation
          path: artifacts/*
          if-no-files-found: warn
