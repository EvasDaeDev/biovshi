name: Tower experimental validation

on:
  push:
    branches:
      - experiment/tower-bosses
  workflow_dispatch:

concurrency:
  group: tower-experiment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tower-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out experimental code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run full game regression suite
        run: npm test
      - name: Build playable game
        run: npm run build
      - name: Simulate tower battles (all seven arenas and six bosses)
        run: node scripts/experiment-tower-fights.mjs --seeds=3 --limit=75 --policy=orbit --out=artifacts/tower-fights.json
      - name: Diagnose boss charges and live body overlaps
        run: node scripts/experiment-tower-fights.mjs --seeds=4 --limit=75 --floors=15,25,30 --diagnose=true --policy=orbit --out=artifacts/tower-charge-diagnostics.json
      - name: Upload battle results even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-fight-report
          path: artifacts/*.json
          if-no-files-found: warn
