name: Tower experimental validation

on:
  push:
    branches:
      - experiment/tower-bosses
  workflow_dispatch:

concurrency:
  group: tower-experiment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tower-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out experimental code
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run full game regression suite
        run: npm test
      - name: Build playable game
        run: npm run build
      - name: Verify standalone game embeds upgrade atlases
        run: |
          npm run standalone
          node --input-type=module -e "import fs from 'node:fs';const html=fs.readFileSync('dist/biovshi.html','utf8');for(const id of ['ar_surg_impact.png','ar_mod_turbo.png','ar_mod_quiet.png'])if(!html.includes(id))throw new Error('Missing inline atlas '+id);console.log('Upgrade textures embedded in offline HTML')"
      - name: Simulate tower battles (all seven arenas and six bosses)
        run: node scripts/experiment-tower-fights.mjs --seeds=3 --limit=75 --policy=orbit --out=artifacts/tower-fights.json
      - name: Diagnose boss charges and live body overlaps
        run: node scripts/experiment-tower-fights.mjs --seeds=4 --limit=75 --floors=15,25,30 --diagnose=true --policy=orbit --out=artifacts/tower-charge-diagnostics.json
      - name: Diagnose long tower fights with close-contact autopilot
        run: node scripts/experiment-tower-fights.mjs --seeds=2 --limit=120 --floors=3,7,9,12,14,17,19 --policy=approach --out=artifacts/tower-long-approach.json
      - name: Compare long fights with orbiting autopilot
        run: node scripts/experiment-tower-fights.mjs --seeds=2 --limit=120 --floors=3,7,9,12,14,17,19 --policy=orbit --out=artifacts/tower-long-orbit.json
      - name: Compare paired fight outcomes
        run: node scripts/compare-tower-fights.mjs artifacts/tower-long-approach.json artifacts/tower-long-orbit.json artifacts/tower-fight-comparison.md
      - name: Upload battle results even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tower-fight-report
          path: artifacts/*
          if-no-files-found: warn
