name: Death balance analysis (diagnostic)
on:
  push:
    branches: [experiment/balance-tactics-v3-short]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mortality:
    strategy:
      fail-fast: false
      matrix:
        seed: [101, 202, 303, 404]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ANALYSIS_SEED: ${{ matrix.seed }}
      ANALYSIS_ROUNDS: '25'
      ANALYSIS_MAX_SECONDS: '150'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Simulate short-commitment A+B v2 and collect tactical switching metrics
        run: node scripts/death-balance-analysis.mjs 2>&1 | tee death-analysis-${{ matrix.seed }}.log; exit ${PIPESTATUS[0]}
      - name: Keep detailed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mortality-${{ matrix.seed }}
          path: death-analysis-${{ matrix.seed }}.log
          if-no-files-found: warn
