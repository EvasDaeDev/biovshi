name: Combat v2 checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/combat-v2]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run tests and save report
        run: |
          npm test > test-results.log 2>&1 || { cat test-results.log; exit 1; }
          cat test-results.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-v2-test-results
          path: test-results.log
          if-no-files-found: ignore
      - run: npm run build
